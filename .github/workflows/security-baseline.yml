# Shared security baseline for every Rue-Asha repo.
#
# Call it pinned to a full commit SHA, never a branch or tag:
#
#   security-baseline:
#     uses: Rue-Asha/ci/.github/workflows/security-baseline.yml@<sha> # vX.Y.Z
#
# The job names below are part of the interface: a caller's ruleset requires
# them by exact name as `<caller job id> / <job name>`. Renaming one is a
# breaking change and needs a major version.
#
# The scanners run as release binaries checked against a pinned SHA-256 rather
# than through their marketplace actions: fewer third-party actions holding a
# token, and gitleaks-action would need a licence key. Dependabot does not
# update these pins; bump version and checksum together by hand.

name: security-baseline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.30.1
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
    steps:
      - name: Check out the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint and zizmor
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          sha256sum -c - <<EOF
          ${ACTIONLINT_SHA256}  actionlint.tar.gz
          ${ZIZMOR_SHA256}  zizmor.tar.gz
          EOF
          tar xzf actionlint.tar.gz actionlint
          tar xzf zizmor.tar.gz zizmor
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint -color

      # zizmor's default only demands SHA pins outside actions/*; the
      # publishing controls demand them everywhere. Written here rather than
      # read from the caller so a caller cannot loosen it. self-repository
      # wants `$/` for local calls, which actionlint still rejects.
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/zizmor.yml" <<'EOF'
          rules:
            unpinned-uses:
              config:
                policies:
                  "*": hash-pin
            self-repository:
              disable: true
          EOF
          zizmor --config "$RUNNER_TEMP/zizmor.yml" --format github .github/workflows

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Full history: a secret added and removed again within a PR is still
      # published.
      - name: Check out the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run gitleaks
        run: gitleaks git --redact --no-banner --verbose .

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-24.04
    # Reviews the PR's dependency diff, so there is nothing to review on push.
    # A skipped job satisfies a required check.
    if: github.event_name == 'pull_request'
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
